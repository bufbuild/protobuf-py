name: Build protoc-runner
on:
  push:
    branches:
      - main
    paths:
      - "packages/protoc-runner/**"
      - .github/workflows/protoc-runner.yaml
  pull_request:
    paths:
      - "packages/protoc-runner/**"
      - .github/workflows/protoc-runner.yaml
  workflow_dispatch:

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: macos-26
          - runner: macos-26-intel
          - runner: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - run: uv sync --frozen
        working-directory: packages/protoc-runner

      - run: uv run poe build
        working-directory: packages/protoc-runner

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform.runner }}
          path: packages/protoc-runner/dist

  release:
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name != 'pull_request' && 'protoc-release' || null }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/protoc-runner/dist
          merge-multiple: true

      - name: Publish to PyPI
        if: github.event_name != 'pull_request'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          packages-dir: packages/protoc-runner/dist
