name: Build protoc-runner
on:
  push:
    branches:
      - main
    paths:
      - "packages/protoc-runner/**"
      - .github/workflows/protoc-runner.yaml
  pull_request:
    paths:
      - "packages/protoc-runner/**"
      - .github/workflows/protoc-runner.yaml
  workflow_dispatch:

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: macos-26
          - runner: macos-26-intel
          - runner: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: uv sync --frozen
        working-directory: packages/protoc-runner

      - run: uv run poe build
        working-directory: packages/protoc-runner

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform.runner }}
          path: packages/protoc-runner/dist

  release:
    needs: build
    runs-on: ubuntu-26.04
    environment: ${{ github.event_name != 'pull_request' && 'protoc-release' || null }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages/protoc-runner/dist
          merge-multiple: true

      - name: Publish to PyPI
        if: github.event_name != 'pull_request'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          packages-dir: packages/protoc-runner/dist
