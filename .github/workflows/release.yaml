name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yaml

permissions:
  id-token: write
  attestations: write
  contents: write

env:
  # When bumping, also bump MATURIN_PEP517_ARGS in ci.yaml
  # maturin flags to build targets we publish non-abi3 wheels for
  UNSTABLE_API_FLAGS: -i 3.13 -i 3.14 -i 3.14t -i 3.15 -i 3.15t
  # maturin flags to build targets we publish abi3 wheels for
  ABI3_FLAGS: -i 3.11 --features pyo3/abi3-py311
  ABI3T_FLAGS: -i 3.15t --features pyo3/abi3t-py315

jobs:
  ext:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64
            manylinux: auto
          - runner: ubuntu-24.04
            target: x86_64
            manylinux: musllinux_1_2
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
          - runner: windows-2025
            target: x86_64
          - runner: windows-11-arm
            target: aarch64
          - runner: macos-15
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out ../../dist ${{ env.UNSTABLE_API_FLAGS }}
          sccache: true
          manylinux: ${{ matrix.manylinux }}
          working-directory: packages/protobuf-py-ext

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out ../../dist ${{ env.ABI3_FLAGS }}
          sccache: true
          manylinux: ${{ matrix.manylinux }}
          working-directory: packages/protobuf-py-ext

      - name: Build abi3t wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out ../../dist ${{ env.ABI3T_FLAGS }}
          sccache: true
          manylinux: ${{ matrix.manylinux }}
          working-directory: packages/protobuf-py-ext

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}${{ matrix.manylinux && format('-{0}', matrix.manylinux) || '' }}
          path: dist

  ext-sdist:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out ../../dist
          working-directory: packages/protobuf-py-ext

      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  release:
    runs-on: ubuntu-26.04
    environment: ${{ (github.event_name == 'workflow_dispatch' && 'pypi-test') || (github.event_name == 'push' && github.ref_type == 'tag' && 'pypi-release') || null }}
    needs:
      - ext
      - ext-sdist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - run: uv sync --frozen

      - name: build protobuf-py-pure
        run: uv build

      - name: build protobuf-py
        run: uv build
        working-directory: packages/protobuf-py

      - name: build protoc-gen-py
        run: uv build
        working-directory: packages/protoc-gen-py

      - name: publish all packages
        if: github.event_name != 'pull_request'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || null }}
          skip-existing: true
