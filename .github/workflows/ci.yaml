name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.runner }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
    env:
      # When bumping, also bump top-level env in release.yaml
      MATURIN_PEP517_ARGS: ${{ (matrix.python-version == '3.11' || matrix.python-version == '3.12') && '--features pyo3/abi3-py311' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
      - name: Setup rust
        run: rustup update
      - run: uv sync --locked
      - run: uv run poe test

      # Ensure tests pass without optional dependencies. Issues would come from eager imports, so we go ahead
      # and run the single conformance test only to keep this step lightweight and give high coverage.
      - run: |
          uv sync --no-dev
          uv run --no-dev --group dev-required pytest -k test_conformance

  test-pypy:
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        # PyPy seems to have possible flaky hangs on Windows related to subprocess invocation
        # which many of our tests use. We go ahead and skip Windows for now.
        os: [Ubuntu, MacOS]
        python-version:
          - "pypy3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run poe test

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run poe lint
      - run: uv run poe format
      - run: uv run poe generate
      - run: uv run poe bootstrap
      - run: uv run poe diffcheck
