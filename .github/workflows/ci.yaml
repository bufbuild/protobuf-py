name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.runner }} / ${{ matrix.python-version }} / ${{ matrix.native-ext && 'ext' || 'standard' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
        native-ext: [true, false]
        exclude:
          # Currently many dependencies need wheel builds on 3.15 which is slow, so only run on push
          - python-version: ${{ github.event_name == 'pull_request' && '3.15' }}
          - python-version: ${{ github.event_name == 'pull_request' && '3.15t' }}
    env:
      # When bumping, also bump top-level env in release.yaml
      MATURIN_ARGS: ${{ (matrix.python-version == '3.10' || matrix.python-version == '3.11') && '--features pyo3/abi3-py310' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
      - name: Setup rust
        if: matrix.native-ext
        run: rustup update
      - run: uv sync --locked
      - name: lint protobuf-py-ext
        if: matrix.native-ext
        run: uv run poe ext-lint
      - name: build protobuf-py-ext
        if: matrix.native-ext
        run: uv run poe ext-build
      - run: uv run poe test
        env:
          ASSERT_MARSHALER_IMPLEMENTATION: ${{ matrix.native-ext && 'native' || 'python' }}

      # Ensure tests pass without optional dependencies. Issues would come from eager imports, so we go ahead
      # and run the single conformance test only to keep this step lightweight and give high coverage.
      - run: |
          uv sync --no-dev
          uv run --no-dev --group dev-required pytest -k test_conformance

  test-pypy:
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        # PyPy seems to have possible flaky hangs on Windows related to subprocess invocation
        # which many of our tests use. We go ahead and skip Windows for now.
        os: [Ubuntu, MacOS]
        python-version:
          - "pypy3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run poe test
        env:
          ASSERT_MARSHALER_IMPLEMENTATION: python

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.10"
      - run: uv sync --locked
      - run: uv run poe lint
      - run: uv run poe format
      - run: uv run poe generate
      - run: uv run poe bootstrap
      - run: uv run poe diffcheck
