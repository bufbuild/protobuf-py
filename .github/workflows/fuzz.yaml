name: Fuzz
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "packages/protobuf-py-ext/fuzz/**"
      - ".github/workflows/fuzz.yaml"
  workflow_dispatch: {} # support manual runs
  schedule:
    - cron: "0 7 * * *"
permissions:
  contents: read
jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Runs the conformance runner for the seeds.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.14"
      # Keeps the corpus between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/protobuf-py-ext/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Setup rust
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-fuzz
      - run: uv sync --locked
      - run: uv run poe fuzz
        env:
          # 15 minutes per target nightly, a minute on push, 30 seconds on PRs.
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '900' || github.event_name == 'pull_request' && '30' || '60' }}
      # Drops corpus inputs that no longer add coverage
      - run: uv run poe fuzz-cmin
        if: github.event_name == 'schedule'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: packages/protobuf-py-ext/fuzz/artifacts
