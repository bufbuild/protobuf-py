# Fuzz targets for cargo-fuzz; see `uv run poe fuzz`.

[package]
name = "protobuf-py-ext-fuzz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[features]
# On by default since OSS-Fuzz's coverage build runs a plain `cargo build
# --bins` in this directory. Builds in the parent directory only build the
# extension, and `--no-default-features` skips libFuzzer.
default = ["libfuzzer"]
# The fuzz targets.
libfuzzer = ["dep:libfuzzer-sys"]

[[bin]]
bench = false
doc = false
name = "binary"
path = "fuzz_targets/binary.rs"
required-features = ["libfuzzer"]
test = false

[[bin]]
bench = false
doc = false
name = "json"
path = "fuzz_targets/json.rs"
required-features = ["libfuzzer"]
test = false

[dependencies]
protobuf-py-ext.workspace = true

libfuzzer-sys = { version = "0.4.13", optional = true }
pyo3.workspace = true

[build-dependencies]
pyo3-build-config.workspace = true

[lints]
workspace = true
