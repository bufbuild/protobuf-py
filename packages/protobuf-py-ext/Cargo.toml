[package]
name = "protobuf-py-ext"
version = "0.1.1"
edition.workspace = true
license.workspace = true

[lib]
# rlib lets the fuzz targets link the module into an embedded interpreter.
crate-type = ["cdylib", "rlib"]
name = "protobuf_ext"

[dependencies]
base64 = "0.23.1"
bitvec = "1.1.1"
buffa = { version = "0.9.2", features = ["json"] }
bytes = "1.12.2"
itoa = "1.0.19"
jiter = { version = "0.19.0", features = ["num-bigint"] }
pyo3.workspace = true
ryu = "1.0.23"

[build-dependencies]
pyo3-build-config.workspace = true

[lints]
workspace = true

[workspace]
members = ["fuzz"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
protobuf-py-ext = { path = "." }
pyo3 = { version = "0.30.1", features = ["bytes", "num-bigint"] }
pyo3-build-config = { version = "0.30.1", features = ["resolve-config"] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
unused_trait_names = "deny"

[profile.release]
debug = 0
strip = true
lto = true
codegen-units = 1
