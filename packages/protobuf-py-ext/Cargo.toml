[package]
name = "protobuf-py-ext"
version = "0.1.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "protobuf_ext"

[dependencies]
base64 = "0.23.1"
bitvec = "1.1.1"
buffa = { version = "0.9.1", features = ["json"] }
bytes = "1.12.1"
itoa = "1.0.18"
jiter = { version = "0.16.0", features = ["num-bigint"] }
pyo3 = { version = "0.29.2", features = ["bytes", "num-bigint"] }
ryu = "1.0.23"

[build-dependencies]
pyo3-build-config = { version = "0.29.2", features = ["resolve-config"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
unused_trait_names = "deny"

[profile.release]
debug = 0
strip = true
lto = true
codegen-units = 1
