[project]
name = "example"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
  "protobuf-py>=0.0.1",
]

[dependency-groups]
dev = [
  "buf-bin==1.73.0",
  "protoc-gen-py>=0.0.1",
  "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

# Own config so the root addopts (xdist workers per marshaler implementation) do not apply.
[tool.pytest]
filterwarnings = ["error"]
