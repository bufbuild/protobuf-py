[project]
name = "example-plugin"
version = "0.0.1"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "protobuf-py>=0.0.1",
]

[project.scripts]
protoc-gen-rpc = "protoc_gen_rpc:main"

[dependency-groups]
dev = [
  "buf-bin==1.73.0",
  "protoc-gen-py>=0.0.1",
  "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

# Own config so the root addopts (xdist workers per marshaler implementation) do not apply.
[tool.pytest]
filterwarnings = ["error"]

[tool.uv.build-backend]
module-name = ["protoc_gen_rpc"]
