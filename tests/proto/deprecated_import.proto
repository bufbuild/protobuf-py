syntax = "proto3";
package deprecated_import;

import "deprecated.proto";

message UsesDeprecated {
  deprecated.DeprecatedMessage message = 1;
  repeated deprecated.DeprecatedEnum enums = 2;
  map<string, deprecated.DeprecatedMessage> messages = 3;
  oneof choice {
    deprecated.DeprecatedMessage.NestedDeprecatedMessage nested = 4;
  }
}
